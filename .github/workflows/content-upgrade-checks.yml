name: Content upgrade checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/content-reader-upgrades, audit/fix-content-type-schema]

jobs:
  syntax-and-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './admin/studio/lib/*' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate all D1 migrations and supported content types
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(':memory:')
          for migration in sorted(Path('migrations').glob('*.sql')):
              print(f'Applying {migration}')
              db.executescript(migration.read_text())

          columns = {row[1] for row in db.execute('PRAGMA table_info(content)')}
          required = {'subject', 'chapter', 'excerpt', 'thumbnail_url'}
          missing = required - columns
          assert not missing, f'Missing content columns: {sorted(missing)}'

          supported = {
              'Study Notes', 'Question Paper', 'Solved Examples', 'Formula Sheet',
              'Solved Paper', 'Unsolved Questions', 'Important Questions'
          }
          for index, content_type in enumerate(sorted(supported)):
              db.execute(
                  "INSERT INTO content (id,title,content_type,study_level,course,created_at,updated_at) VALUES (?,?,?,?,?,?,?)",
                  (str(index), f'Test {content_type}', content_type, 'School Mathematics', 'Class 10', 'now', 'now')
              )
          assert db.execute('SELECT COUNT(*) FROM content').fetchone()[0] == len(supported)
          assert db.execute("SELECT COUNT(*) FROM books").fetchone()[0] == 0
          print('All migrations + all Admin Studio content types: PASS')
          PY
