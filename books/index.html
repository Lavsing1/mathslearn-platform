<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematics Books | MathsLearn</title><meta name="description" content="Read mathematics books and chapters on MathsLearn."><link rel="stylesheet" href="../admin/studio/css/katex.css"><script src="../admin/studio/lib/katex.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#10213d;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#fff;border-bottom:1px solid #dce5f3;padding:16px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:850}.brand span{color:#2563eb}main{max-width:1120px;margin:34px auto;padding:0 20px}h1{font-size:clamp(28px,4vw,42px);line-height:1.15}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.card{background:#fff;border:1px solid #dce5f3;border-radius:16px;padding:20px;box-shadow:0 6px 22px #1b3d6b0b}.card h2{margin:0 0 8px;font-size:21px}.muted{color:#64748b}.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;border-radius:9px;padding:10px 14px;font-weight:750}.error{color:#b91c1c}.reader{max-width:850px;margin:26px auto;background:#fff;padding:clamp(18px,4vw,56px);border:1px solid #dce5f3;border-radius:16px}.chapter{border-top:1px solid #e2e8f0;margin-top:32px;padding-top:20px}.block{margin:16px 0;padding:14px 16px;border-left:4px solid #cbd5e1;background:#fbfdff;border-radius:4px}.tag{font-weight:800;color:#1d4ed8;text-transform:uppercase;font-size:.78em;letter-spacing:.06em}.formula{overflow-x:auto}.display-formula{display:block;text-align:center;margin:1em 0;max-width:100%}.formula-error{color:#b91c1c;white-space:pre-wrap}.ml-image-block img{max-width:100%;height:auto}.diagram{max-width:100%;overflow:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}@media(max-width:600px){.reader{border-radius:0;margin:0;padding:18px}.top{padding:12px 18px}}

/* Textbook-style library and reader controls */
.library-tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}.library-tools input,.library-tools select,.page-jump input{min-width:0;border:1px solid #cbd8ea;border-radius:10px;padding:12px 13px;font:inherit;background:#fff;color:#10213d}.library-tools input{flex:1;min-width:220px}.book-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}.book-toc{position:sticky;top:12px;background:#fff;border:1px solid #dce5f3;border-radius:14px;padding:16px;max-height:75vh;overflow:auto}.book-toc h2{font-size:17px;margin:0 0 10px}.book-toc a{display:block;padding:8px 10px;margin:3px 0;border-radius:8px;color:#1d4ed8;text-decoration:none;font-size:14px}.book-toc a:hover,.book-toc a.active{background:#eff6ff}.book-main{min-width:0}.reader-tools{position:sticky;top:0;z-index:4;background:#f4f7fcf2;backdrop-filter:blur(10px);border:1px solid #dce5f3;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.reader-tools input[type=search]{flex:1;min-width:170px}.reader-tools input,.reader-tools button{border:1px solid #cbd8ea;border-radius:8px;padding:9px 10px;font:inherit;background:#fff;color:#10213d}.reader-tools button{cursor:pointer;font-weight:700}.page-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:#475569}.page-jump input{width:76px}.reader .chapter{scroll-margin-top:100px}.search-hit{outline:2px solid #f59e0b!important;background:#fffbeb!important}.search-status{font-size:13px;color:#475569;width:100%}.chapter-page-label{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;margin-bottom:8px}.book-card-meta{display:flex;gap:8px;flex-wrap:wrap;color:#64748b;font-size:13px}.book-card .btn{margin-top:8px}@media(max-width:760px){.book-layout{grid-template-columns:1fr}.book-toc{position:static;max-height:240px}.reader-tools{position:static}.library-tools input{min-width:100%}}
