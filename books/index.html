<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematics Books | MathsLearn</title><meta name="description" content="Read mathematics books and chapters on MathsLearn."><link rel="stylesheet" href="../admin/studio/css/katex.css"><script src="../admin/studio/lib/katex.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#10213d;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#fff;border-bottom:1px solid #dce5f3;padding:16px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:850}.brand span{color:#2563eb}main{max-width:1120px;margin:34px auto;padding:0 20px}h1{font-size:clamp(28px,4vw,42px);line-height:1.15}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.card{background:#fff;border:1px solid #dce5f3;border-radius:16px;padding:20px;box-shadow:0 6px 22px #1b3d6b0b}.card h2{margin:0 0 8px;font-size:21px}.muted{color:#64748b}.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;border-radius:9px;padding:10px 14px;font-weight:750}.error{color:#b91c1c}.reader{max-width:850px;margin:26px auto;background:#fff;padding:clamp(18px,4vw,56px);border:1px solid #dce5f3;border-radius:16px}.chapter{border-top:1px solid #e2e8f0;margin-top:32px;padding-top:20px}.block{margin:16px 0;padding:14px 16px;border-left:4px solid #cbd5e1;background:#fbfdff;border-radius:4px}.tag{font-weight:800;color:#1d4ed8;text-transform:uppercase;font-size:.78em;letter-spacing:.06em}.formula{overflow-x:auto}.ml-image-block img{max-width:100%;height:auto}.diagram{max-width:100%;overflow:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}@media(max-width:600px){.reader{border-radius:0;margin:0;padding:18px}.top{padding:12px 18px}}
</style></head><body><header class="top"><div class="brand">△ Maths<span>Learn</span></div><span class="muted">Mathematics Library</span></header><main><div class="toolbar"><a class="btn" href="./index.html">← All books</a></div><div id="app">Loading published books…</div></main><script>
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeDataImage=s=>/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(String(s||''))?s:'';
function rich(s){let x=esc(s||'');x=x.replace(/\\$\\$([\\s\\S]+?)\\$\\$|\\$([^$\\n]+?)\\$/g,(_,a,b)=>'<span class="formula">'+esc(a!==undefined?a:b)+'</span>');x=x.replace(/\\n\\n/g,'</p><p>').replace(/\\n/g,'<br>');return '<p>'+x+'</p>';}
function renderLecture(l,i){const title=esc(l.title||('Chapter '+(i+1)));let out='<section class="chapter"><h2>'+title+'</h2><p class="muted">'+esc(l.subtitle||'')+'</p>';
(l.steps||[]).forEach(s=>{const typ=String(s.type||'text');if(typ==='section'||typ==='subsection'){out+='<h3>'+rich(s.heading||s.content||'')+'</h3>';return;}out+='<article class="block">';if(['definition','theorem','lemma','corollary','proof','example','remark','exercise'].includes(typ))out+='<div class="tag">'+esc(typ)+'</div>';if(s.heading)out+='<h3>'+rich(s.heading)+'</h3>';out+=rich(s.content||'');const im=safeDataImage(s.imageData);if(im)out+='<figure class="ml-image-block"><img src="'+im+'" alt="'+esc(s.imageAlt||'Book illustration')+'" style="width:'+Math.max(20,Math.min(100,Number(s.imageWidth)||100))+'%;display:block;margin:'+(s.imageAlign==='left'?'0 auto 0 0':s.imageAlign==='right'?'0 0 0 auto':'0 auto')+'"><figcaption>'+esc(s.imageCaption||'')+'</figcaption></figure>';if(s.draw&&Array.isArray(s.draw.shapes)&&s.draw.shapes.length){out+='<div class="diagram"><svg viewBox="0 0 800 '+Math.max(120,Math.min(900,Number(s.draw.h)||300))+'" width="100%" role="img" aria-label="Mathematics diagram">';s.draw.shapes.forEach(d=>{if(d.t==='line'||d.t==='dash'||d.t==='arrow')out+='<line x1="'+Number(d.x1)+'" y1="'+Number(d.y1)+'" x2="'+Number(d.x2)+'" y2="'+Number(d.y2)+'" stroke="#1d4ed8" stroke-width="2.5" '+(d.t==='dash'?'stroke-dasharray="8 6"':'')+'/>';else if(d.t==='circ')out+='<circle cx="'+Number(d.x1)+'" cy="'+Number(d.y1)+'" r="'+Math.hypot(Number(d.x2)-Number(d.x1),Number(d.y2)-Number(d.y1))+'" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>';else if(d.t==='rect')out+='<rect x="'+Math.min(Number(d.x1),Number(d.x2))+'" y="'+Math.min(Number(d.y1),Number(d.y2))+'" width="'+Math.abs(Number(d.x2)-Number(d.x1))+'" height="'+Math.abs(Number(d.y2)-Number(d.y1))+'" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>';});out+='</svg></div>';}out+='</article>';});
return out+'</section>';}
function math(root){if(window.katex)root.querySelectorAll('.formula').forEach(e=>{const t=e.textContent;try{katex.render(t,e,{throwOnError:false,displayMode:t.includes('\\\\')||t.length>35})}catch{}});}
async function main(){const id=new URLSearchParams(location.search).get('id');if(!id){const r=await fetch('/api/books',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load books');app.innerHTML='<h1>Mathematics Books</h1><p class="muted">Read published books online.</p>'+(((d.books||[]).length)?'<div class="grid">'+(d.books||[]).map(b=>'<article class="card"><h2>'+esc(b.title)+'</h2><p>'+esc(b.subtitle||'')+'</p><p class="muted">'+esc(b.author||'')+'</p><a class="btn" href="./index.html?id='+encodeURIComponent(b.id)+'">Read book</a></article>').join('')+'</div>':'<p>No books published yet.</p>');return;}
const r=await fetch('/api/books?id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Book is not available');const b=d.book,book=b.book||{};app.innerHTML='<article class="reader"><h1>'+esc(book.title||b.title)+'</h1><p>'+esc(book.subtitle||b.subtitle||'')+'</p><p class="muted">'+esc(book.author||b.author||'')+'</p><hr>'+(b.lectures||[]).map(renderLecture).join('')+'</article>';math(app);}
main().catch(e=>app.innerHTML='<p class="error">'+esc(e.message)+'</p>');
</script></body></html>
