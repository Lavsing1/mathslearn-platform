<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematics Books | MathsLearn</title><meta name="description" content="Read mathematics books and chapters on MathsLearn."><link rel="stylesheet" href="../admin/studio/css/katex.css"><script src="../admin/studio/lib/katex.min.js"></script><style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fc;color:#10213d;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#fff;border-bottom:1px solid #dce5f3;padding:16px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:850}.brand span{color:#2563eb}main{max-width:1120px;margin:34px auto;padding:0 20px}h1{font-size:clamp(28px,4vw,42px);line-height:1.15}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.card{background:#fff;border:1px solid #dce5f3;border-radius:16px;padding:20px;box-shadow:0 6px 22px #1b3d6b0b}.card h2{margin:0 0 8px;font-size:21px}.muted{color:#64748b}.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;border-radius:9px;padding:10px 14px;font-weight:750}.error{color:#b91c1c}.reader{max-width:850px;margin:26px auto;background:#fff;padding:clamp(18px,4vw,56px);border:1px solid #dce5f3;border-radius:16px}.chapter{border-top:1px solid #e2e8f0;margin-top:32px;padding-top:20px}.block{margin:16px 0;padding:14px 16px;border-left:4px solid #cbd5e1;background:#fbfdff;border-radius:4px}.tag{font-weight:800;color:#1d4ed8;text-transform:uppercase;font-size:.78em;letter-spacing:.06em}.formula{overflow-x:auto}.display-formula{display:block;text-align:center;margin:1em 0;max-width:100%}.formula-error{color:#b91c1c;white-space:pre-wrap}.ml-image-block img{max-width:100%;height:auto}.diagram{max-width:100%;overflow:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}@media(max-width:600px){.reader{border-radius:0;margin:0;padding:18px}.top{padding:12px 18px}}

/* Book-like reader, topic search and logical page navigation */
.reader-tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:end;background:#fff;border:1px solid #dce5f3;border-radius:14px;padding:14px;margin:18px 0}
.reader-tools label{display:grid;gap:5px;font-size:13px;font-weight:750;color:#475569}
.reader-tools input,.reader-tools button{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;background:#fff;color:#10213d;min-width:0}
.reader-tools button{cursor:pointer;font-weight:750}.reader-tools .primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.book-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.book-toc{position:sticky;top:12px;background:#fff;border:1px solid #dce5f3;border-radius:14px;padding:16px;max-height:75vh;overflow:auto}
.book-toc h2{font-size:16px;margin:0 0 10px}.toc-link{display:block;text-align:left;width:100%;border:0;background:transparent;color:#334155;padding:8px;border-radius:7px;cursor:pointer;font:inherit;font-size:14px}.toc-link:hover,.toc-link.active{background:#eff6ff;color:#1d4ed8}
.book-sheet{min-width:0;background:#fff;border:1px solid #dce5f3;border-radius:16px;padding:clamp(20px,4vw,52px);box-shadow:0 10px 34px #1b3d6b0b;min-height:58vh}
.book-sheet .book-kicker{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:850;color:#2563eb}
.book-sheet h1{margin:.35em 0}.book-sheet .book-meta{color:#64748b;border-bottom:1px solid #e2e8f0;padding-bottom:18px;margin-bottom:24px}
.book-page-content h2{font-size:clamp(22px,3vw,30px);margin:0 0 12px}.book-page-content h3{font-size:19px;margin:22px 0 8px}
.page-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #dce5f3;border-radius:12px;padding:12px;margin-top:12px}
.page-controls button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:750;color:#10213d}.page-controls button:disabled{opacity:.4;cursor:not-allowed}
.page-count{font-weight:800;font-variant-numeric:tabular-nums;color:#334155}.search-results{margin:0 0 16px}.search-results button{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;background:#fff;border:1px solid #dce5f3;border-radius:9px;cursor:pointer;color:#10213d}.search-results button strong{display:block}.search-results button small{color:#64748b}.search-results mark{background:#fff0a8}
@media(max-width:760px){.book-layout{grid-template-columns:1fr}.book-toc{position:static;max-height:none}.reader-tools{grid-template-columns:1fr 1fr}.reader-tools label:first-child{grid-column:1/-1}.book-sheet{border-radius:12px}.top{flex-wrap:wrap}}
</style></head><body><header class="top"><div class="brand">△ Maths<span>Learn</span></div><span class="muted">Mathematics Library</span></header><main><div class="toolbar"><a class="btn" href="./index.html">← All books</a></div><div id="app">Loading published books…</div></main><script defer src="./reader.js"></script></body></html>
